<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《穿成惡毒女配後，偶像突然愛上我了？》</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        body, html {
            background-color: #0b0b0b; /* 外層極深色背景 */
            font-family: 'PingFang TC', 'Microsoft JhengHei', serif;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 遊戲核心畫框：強制鎖定標準 9:16 比例，完美置中 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16)); /* 自動計算配合高度的 9:16 寬度 */
            max-height: calc(100vw * (16 / 9)); /* 自動計算配合寬度的 16:9 高度 */
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: none; /* 點擊前置畫面後顯示 */
        }

        /* 點擊進入的前置畫面 (解鎖音樂用) */
        #init-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            letter-spacing: 2px;
            z-index: 100;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* --- 封面畫面區塊 --- */
        #cover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            transition: opacity 1s ease;
        }

        /* 封面圖片：強制填滿 9:16 框但不變形 */
        #cover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保 9:16 比例填滿遊戲框 */
            object-position: center;
            z-index: 1;
        }

        /* 封面按鈕群組容器 */
        #menu-buttons {
            position: absolute;
            bottom: 6vh; 
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2; 
        }

        /* 共用按鈕樣式 (極致收窄版) */
        .menu-btn {
            background: rgba(15, 15, 15, 0.75); 
            color: #f7e0b5;
            border: 1px solid #d4af37;
            padding: 10px 0;       
            width: 140px;          
            margin: 6px 0;         
            font-size: 0.95rem;    
            letter-spacing: 4px;
            text-align: center;
            cursor: pointer;
            border-radius: 25px;
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .menu-btn:active {
            background: #d4af37;
            color: #000;
            transform: scale(0.95);
        }

        /* --- 進入遊戲後的「主選單 / 章節選擇」畫面 --- */
        #chapter-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: none; 
            z-index: 8;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* 章節選擇背景圖片：填滿 9:16 框 */
        #chapter-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* 章節選單按鈕容器 (完美置中於 9:16 框正中央) */
        #chapter-buttons {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 15px; 
            z-index: 2;
        }

        /* --- 遊戲對話主畫面區塊 --- */
        #game-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* 預設對話框 */
        #dialogue-box {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            min-height: 130px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        #speaker-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f7e0b5;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- 音樂播放器 -->
    <audio id="bgm" loop>
        <source src="https://www.image2url.com/r2/default/audio/1786578073145-4ceb75f9-f219-432e-a187-bc50cbe7130f.mp3" type="audio/mpeg">
    </audio>

    <!-- 前置解鎖畫面 -->
    <div id="init-screen" onclick="initGame()">
        ▼ 點擊螢幕進入遊戲 ▼
    </div>

    <div id="game-container">
        
        <!-- 1. 封面主選單 -->
        <div id="cover-screen">
            <img id="cover-image" src="https://i.ibb.co/nNzFx9KD/77-E17-E51-BA81-4-B70-B786-2-C247-F4-B7161.png" alt="遊戲封面">
            <div id="menu-buttons">
                <div class="menu-btn" onclick="goToChapterScreen()">開始遊戲</div>
                <div class="menu-btn" onclick="alert('目前尚無存檔紀錄！')">讀取進度</div>
            </div>
        </div>

        <!-- 2. 章節選擇與人物介紹畫面 -->
        <div id="chapter-screen">
            <img id="chapter-image" src="https://i.ibb.co/60kTsc49/3-E25-D517-6694-415-E-9-BCA-EDE45948-C249.png" alt="章節背景">
            <div id="chapter-buttons">
                <div class="menu-btn" onclick="showCharacters()">人物介紹</div>
                <div class="menu-btn" onclick="startPrologue()">序章</div>
            </div>
        </div>

        <!-- 3. 進入遊戲後的對話畫面 -->
        <div id="game-screen">
            <div id="dialogue-box" onclick="alert('序章劇情載入中...')">
                <div id="speaker-name">系統提示</div>
                <div id="dialogue-text">歡迎進入《穿成惡毒女配後，偶像突然愛上我了？》<br><br>請點擊螢幕繼續...</div>
            </div>
        </div>

    </div>

    <script>
        // 阻止預設的滾動行為
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // 解鎖音樂
        function initGame() {
            const initScreen = document.getElementById('init-screen');
            const gameContainer = document.getElementById('game-container');
            const bgm = document.getElementById('bgm');

            bgm.play().catch(error => {
                console.log("音樂播放失敗", error);
            });

            initScreen.style.display = 'none';
            gameContainer.style.display = 'block';
        }

        // 封面點擊「開始遊戲」 -> 進入章節選擇畫面
        function goToChapterScreen() {
            const cover = document.getElementById('cover-screen');
            const chapterScreen = document.getElementById('chapter-screen');
            
            cover.style.opacity = '0';
            
            setTimeout(() => {
                cover.style.display = 'none';
                chapterScreen.style.display = 'block';
                
                setTimeout(() => {
                    chapterScreen.style.opacity = '1';
                }, 50);
            }, 1000); 
        }

        // 點擊「人物介紹」
        function showCharacters() {
            alert('人物介紹建置中，敬請期待！');
        }

        // 點擊「序章」 -> 進入遊戲對話畫面
        function startPrologue() {
            const chapterScreen = document.getElementById('chapter-screen');
            const gameScreen = document.getElementById('game-screen');
            
            chapterScreen.style.opacity = '0';
            
            setTimeout(() => {
                chapterScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                
                setTimeout(() => {
                    gameScreen.style.opacity = '1';
                }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
